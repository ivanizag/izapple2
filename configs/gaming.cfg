# A machine set up for playing games. It is the default of the libretro core.
#
# An enhanced Apple //e, the model that runs most of the Apple II catalogue,
# with the Mockingboard for the games that play their music through it and the
# accelerator that the game launchers use to load faster.
#
# It is built up from the base and not from 2enh so that it says what a machine
# for playing has instead of what it has to lose: there is no mouse, games do
# not need one, and no VidHD, as the libretro core does not render super hi-res
# and leaving the card out keeps the software from switching to a mode that
# would not be shown.
name: Apple //e for gaming
parent: _base
board: 2e
cpu: 65c02
rom: <internal>/Apple2e_Enhanced.rom
charrom: <internal>/Apple IIe Video Enhanced.bin
ramworks: 8192
nsc: main
s0: language
s3: fastchip
s4: mockingboard
s6: diskii,disk1=<internal>/dos33.dsk
